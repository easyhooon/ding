name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify libraries and sample
        run: >-
          ./gradlew
          :ding-core:ktlintCheck
          :ding-core:testAndroidHostTest
          :ding:ktlintCheck
          :ding-noop:ktlintCheck
          :ding:detekt
          :ding-noop:detekt
          :ding:lintRelease
          :ding-noop:lintRelease
          :sample:assembleDebug
          :sample:assembleRelease

  verify-apple:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Verify Apple targets
        run: >-
          ./gradlew
          :ding-core:compileKotlinIosArm64
          :ding-core:iosSimulatorArm64Test
